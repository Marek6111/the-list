<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The List | Marek & Zuzanna</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #faf9f6; --accent: #d98c72; --text: #2d2d2d; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; padding: 40px 20px; }
        .icon-circle { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin: 10px 0; font-weight: 400; }
        h1 span { font-style: italic; color: var(--accent); }
        .subtitle { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; color: #888; margin-bottom: 20px; }
        .container { width: 90%; max-width: 450px; padding-bottom: 100px; }
        .card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #eee; font-size: 16px; box-sizing: border-box; }
        button { background: var(--text); color: white; border: none; cursor: pointer; font-weight: 600; }
        button.secondary { background: var(--accent); }
        .item-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .checkbox { width: 22px; height: 22px; margin-right: 12px; }
        .item-info { flex-grow: 1; }
        .shopping-mode-active { background-color: #f0f4f8; }
        #shopping-footer { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: white; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); display: none; }
    </style>
</head>
<body>

<header>
    <div class="icon-circle">🛒</div>
    <h1>The <span>List</span></h1>
    <div class="subtitle">Marek &nbsp; ❤ &nbsp; Zuzanna</div>
</header>

<div class="container">
    <div id="auth-section" class="card">
        <input type="email" id="email" placeholder="Dummy Email (e.g. marek@home.local)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Sign In</button>
        <p id="auth-error" style="color: red; font-size: 0.8rem; text-align: center; display: none;"></p>
    </div>

    <div id="main-section" style="display:none;">
        <div class="card not-shopping">
            <input type="text" id="item-name" placeholder="What do we need?">
            <div style="display:flex; gap: 10px;">
                <select id="item-shop">
                    <option value="Lidl">Lidl</option>
                    <option value="Tesco">Tesco</option>
                    <option value="Home Bargains">Home Bargains</option>
                </select>
                <input type="number" id="item-price" placeholder="Price (£)" step="0.01">
            </div>
            <button onclick="addItem()" class="secondary">Add to List</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Current List</h3>
                <button onclick="toggleShoppingMode()" style="width: auto; padding: 5px 10px;">Shop Mode</button>
            </div>
            <div id="shopping-list"></div>
        </div>

        <div class="card not-shopping">
            <h3>Weekly Spend</h3>
            <canvas id="historyChart"></canvas>
        </div>
    </div>
</div>

<div id="shopping-footer">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <div>Total: <strong id="shop-total">£0.00</strong></div>
        <button onclick="finishShopping()" class="secondary" style="width: auto;">Finish</button>
    </div>
</div>

<script>
    // Your specific Supabase credentials
    const supabaseUrl = 'https://yurgugvqdnpmbzqepes.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1cmd1Z3ZxZG5wcG1ienFlcGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjg3MjUsImV4cCI6MjA5MzY0NDcyNX0.tjX8TmlDS_RJR4BhEN8bkIB8sy-yKpufx8l1UH2Mj-g';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let isShoppingMode = false;

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('auth-error');
        
        try {
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-section').style.display = 'block';
            loadItems();
            loadHistory();
            initRealtime();
        } catch (err) {
            errorEl.innerText = "Login failed: " + err.message;
            errorEl.style.display = 'block';
        }
    }

    async function addItem() {
        const name = document.getElementById('item-name').value;
        const price = document.getElementById('item-price').value || 0;
        const shop = document.getElementById('item-shop').value;
        if (!name) return;

        await _supabase.from('items').insert([{ name, price, shop, is_purchased: false }]);
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
    }

    async function loadItems() {
        const { data } = await _supabase.from('items').select('*').order('created_at', { ascending: false });
        const container = document.getElementById('shopping-list');
        container.innerHTML = data.map(item => `
            <div class="item-row">
                <input type="checkbox" class="checkbox" ${item.is_purchased ? 'checked' : ''} 
                    onclick="toggleItem(${item.id}, ${item.is_purchased})">
                <div class="item-info">
                    <span style="${item.is_purchased ? 'text-decoration: line-through; color: #ccc;' : ''}">${item.name}</span>
                    <div style="font-size: 0.7rem; color: #999;">£${item.price} - ${item.shop}</div>
                </div>
            </div>
        `).join('');
    }

    async function toggleItem(id, currentStatus) {
        await _supabase.from('items').update({ is_purchased: !currentStatus }).eq('id', id);
        loadItems();
        if (isShoppingMode) calculateTotal();
    }

    function toggleShoppingMode() {
        isShoppingMode = !isShoppingMode;
        document.body.classList.toggle('shopping-mode-active');
        document.getElementById('shopping-footer').style.display = isShoppingMode ? 'block' : 'none';
        calculateTotal();
    }

    async function calculateTotal() {
        const { data } = await _supabase.from('items').select('price').eq('is_purchased', true);
        const total = data.reduce((acc, curr) => acc + parseFloat(curr.price || 0), 0);
        document.getElementById('shop-total').innerText = `£${total.toFixed(2)}`;
    }

    async function finishShopping() {
        const { data: checked } = await _supabase.from('items').select('*').eq('is_purchased', true);
        const total = checked.reduce((acc, curr) => acc + parseFloat(curr.price || 0), 0);
        
        await _supabase.from('shopping_history').insert([{ total_spent: total, items_count: checked.length }]);
        await _supabase.from('items').delete().eq('is_purchased', true);
        
        toggleShoppingMode();
        loadItems();
        loadHistory();
    }

    async function loadHistory() {
        const { data } = await _supabase.from('shopping_history').select('*').order('created_at', { ascending: true });
        if (!data.length) return;
        const ctx = document.getElementById('historyChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => new Date(d.created_at).toLocaleDateString()),
                datasets: [{ data: data.map(d => d.total_spent), borderColor: '#d98c72', fill: false }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function initRealtime() {
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => loadItems()).subscribe();
    }
</script>
</body>
</html>
