<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The List | Marek & Zuzanna</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #faf9f6; --accent: #d98c72; --text: #2d2d2d; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; padding: 60px 20px 40px; }
        .icon-circle { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin: 0; font-weight: 400; letter-spacing: -1px; }
        h1 span { font-style: italic; color: var(--accent); }
        .subtitle { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; color: #999; margin-top: 10px; }
        .container { width: 92%; max-width: 420px; padding-bottom: 120px; }
        .card { background: var(--white); padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.02); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.01); }
        input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; border: 1px solid #f0f0f0; font-size: 16px; box-sizing: border-box; outline: none; }
        button { background: var(--text); color: white; border: none; cursor: pointer; font-weight: 600; }
        button.secondary { background: var(--accent); }
        .item-row { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #fcfcfc; }
        .checkbox { width: 24px; height: 24px; margin-right: 15px; accent-color: var(--accent); cursor: pointer; }
        .item-info { flex-grow: 1; }
        .note-bubble { background: #fdfdfd; padding: 12px; border-radius: 18px; margin-bottom: 12px; border-left: 4px solid var(--accent); font-size: 0.95rem; }
        .note-meta { font-size: 0.7rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        #shop-footer { position: fixed; bottom: 20px; width: 90%; max-width: 380px; background: var(--text); color: white; padding: 20px; border-radius: 24px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); z-index: 1000; }
        .shopping-active { background: #f0f2f5; }
        .shopping-active .hide-in-shop { display: none; }
    </style>
</head>
<body>

<header>
    <div class="icon-circle">🛒</div>
    <h1>The <span>List</span></h1>
    <div class="subtitle">Marek &nbsp; ❤ &nbsp; Zuzanna</div>
</header>

<div class="container">
    <!-- AUTH -->
    <div id="auth-box" class="card">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Sign In</button>
        <p id="auth-err" style="color:var(--accent); font-size:0.8rem; text-align:center; display:none; margin-top:10px;"></p>
    </div>

    <!-- MAIN -->
    <div id="app" style="display:none;">
        <div class="card hide-in-shop">
            <input type="text" id="new-item" placeholder="What do we need?">
            <div style="display:flex; gap:10px;">
                <select id="new-shop"><option>Lidl</option><option>Tesco</option><option>Home Bargains</option></select>
                <input type="number" id="new-price" placeholder="£" step="0.01">
            </div>
            <button class="secondary" onclick="addItem()">Add to List</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="font-family:'Playfair Display'; margin:0;">Current List</h3>
                <button onclick="toggleShop()" style="width:auto; padding:6px 16px; font-size:0.8rem;">Shop Mode</button>
            </div>
            <div id="items-list"></div>
        </div>

        <div class="card hide-in-shop">
            <h3 style="font-family:'Playfair Display'; margin-top:0;">Notes for Each Other</h3>
            <div id="notes-list"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <input type="text" id="new-note" placeholder="Write a note...">
                <button onclick="addNote()" class="secondary" style="width:80px;">Send</button>
            </div>
        </div>

        <div class="card hide-in-shop">
            <h3 style="font-family:'Playfair Display'; margin-top:0;">Spend Over Time</h3>
            <canvas id="historyChart"></canvas>
        </div>
    </div>
</div>

<div id="shop-footer">
    <span>Total: <strong id="live-total">£0.00</strong></span>
    <button onclick="finishShop()" class="secondary" style="width:auto; padding:10px 24px;">Finish & Archive</button>
</div>

<script>
    const SURL = 'https://yurgugvqdnpmbzqepes.supabase.co';
    const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1cmd1Z3ZxZG5wcG1ienFlcGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjg3MjUsImV4cCI6MjA5MzY0NDcyNX0.tjX8TmlDS_RJR4BhEN8bkIB8sy-yKpufx8l1UH2Mj-g';
    const _sb = supabase.createClient(SURL, SKEY);

    let shopMode = false;
    let currentUser = null;

    async function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        const { data, error } = await _sb.auth.signInWithPassword({ email: e, password: p });
        if(error) {
            document.getElementById('auth-err').innerText = error.message;
            document.getElementById('auth-err').style.display = 'block';
        } else {
            currentUser = data.user;
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            start();
        }
    }

    async function start() {
        refreshItems();
        refreshNotes();
        refreshHistory();
        _sb.channel('updates').on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>refreshItems()).subscribe();
        _sb.channel('notes').on('postgres_changes',{event:'*',schema:'public',table:'notes'},()=>refreshNotes()).subscribe();
    }

    async function addItem() {
        const name = document.getElementById('new-item').value;
        const price = document.getElementById('new-price').value || 0;
        const shop = document.getElementById('new-shop').value;
        if(!name) return;
        await _sb.from('items').insert([{ name, price, shop }]);
        document.getElementById('new-item').value = '';
    }

    async function refreshItems() {
        const { data } = await _sb.from('items').select('*').order('created_at', {ascending: false});
        const container = document.getElementById('items-list');
        container.innerHTML = data.map(i => `
            <div class="item-row">
                <input type="checkbox" class="checkbox" ${i.is_purchased?'checked':''} onclick="updateItem(${i.id},${i.is_purchased})">
                <div class="item-info">
                    <span style="${i.is_purchased?'text-decoration:line-through;color:#ccc':'font-weight:500'}">${i.name}</span>
                    <div style="font-size:0.75rem; color:#aaa; margin-top:2px;">£${i.price} • ${i.shop}</div>
                </div>
            </div>
        `).join('');
        if(shopMode) updateLiveTotal();
    }

    async function updateItem(id, status) {
        await _sb.from('items').update({is_purchased: !status}).eq('id', id);
    }

    function toggleShop() {
        shopMode = !shopMode;
        document.body.classList.toggle('shopping-active');
        document.getElementById('shop-footer').style.display = shopMode ? 'flex' : 'none';
        updateLiveTotal();
    }

    async function updateLiveTotal() {
        const { data } = await _sb.from('items').select('price').eq('is_purchased', true);
        const total = data.reduce((acc, curr) => acc + parseFloat(curr.price), 0);
        document.getElementById('live-total').innerText = `£${total.toFixed(2)}`;
    }

    async function finishShop() {
        const { data: checked } = await _sb.from('items').select('*').eq('is_purchased', true);
        if(checked.length === 0) return toggleShop();
        const total = checked.reduce((acc, curr) => acc + parseFloat(curr.price), 0);
        await _sb.from('shopping_history').insert([{ total_spent: total, items_count: checked.length }]);
        await _sb.from('items').delete().eq('is_purchased', true);
        toggleShop();
        refreshHistory();
    }

    async function addNote() {
        const content = document.getElementById('new-note').value;
        if(!content) return;
        const author = currentUser.email.toLowerCase().includes('marek') ? 'Marek' : 'Zuzanna';
        await _sb.from('notes').insert([{ content, author }]);
        document.getElementById('new-note').value = '';
    }

    async function refreshNotes() {
        const { data } = await _sb.from('notes').select('*').order('created_at', {ascending: false}).limit(5);
        document.getElementById('notes-list').innerHTML = data.map(n => `
            <div class="note-bubble"><div class="note-meta">${n.author}</div>${n.content}</div>
        `).join('');
    }

    async function refreshHistory() {
        const { data } = await _sb.from('shopping_history').select('*').order('created_at', {ascending: true}).limit(10);
        if(!data.length) return;
        const ctx = document.getElementById('historyChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type:'line',
            data:{
                labels: data.map(d => new Date(d.created_at).toLocaleDateString()),
                datasets:[{ data: data.map(d=>d.total_spent), borderColor:'#d98c72', tension:0.4, fill:false }]
            },
            options:{ plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
        });
    }
</script>
</body>
</html>
